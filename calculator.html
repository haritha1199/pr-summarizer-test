<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CALCULATOR 14 — PRO WORKSTATION</title>
  <link rel="stylesheet" href="calculator.css" />
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="theme-dark-pro">
  <div class="calc-container pro-workstation">
    
    <!-- Left Hand: Contextual Workspace & Data Analytics Viewport -->
    <aside class="workspace-sidebar" aria-label="Data and Analytics Panel">
      <!-- Graphing Visualizer Section -->
      <section class="graphing-canvas-panel">
        <header class="panel-header">
          <span class="panel-title">Function Visualizer // 2D Plotter</span>
          <div class="panel-controls">
            <button class="icon-btn-sm" id="zoom-in" title="Zoom In">+</button>
            <button class="icon-btn-sm" id="zoom-out" title="Zoom Out">−</button>
          </div>
        </header>
        <div class="canvas-viewport" id="plotter-viewport">
          <!-- Scalable canvas for math rendering scripts or SVG plots -->
          <div class="canvas-placeholder-grid"></div>
        </div>
      </section>

      <!-- Active Program State Registers -->
      <section class="variable-registry" aria-label="Stored Variables">
        <header class="panel-header">
          <span class="panel-title">Active Registers</span>
        </header>
        <div class="registry-grid">
          <div class="register-pill" data-var="x"><span class="var-name">x</span><span class="var-val">0.0000</span></div>
          <div class="register-pill" data-var="y"><span class="var-name">y</span><span class="var-val">0.0000</span></div>
          <div class="register-pill" data-var="z"><span class="var-name">z</span><span class="var-val">0.0000</span></div>
          <div class="register-pill" data-var="ans"><span class="var-name">ans</span><span class="var-val">0.0000</span></div>
        </div>
      </section>
    </aside>

    <!-- Right Hand: Core Computational Engine Engine -->
    <main class="calc-card engine-card">
      
      <!-- Top Premium Control Bar -->
      <header class="calc-header">
        <div class="header-left">
          <span class="brand-badge alpha-badge">CALC // 14 PRO</span>
          <div class="status-indicators">
            <span class="status-dot active" id="rad-deg-indicator">RAD</span>
            <span class="status-dot" id="matrix-indicator">MTX</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="history-panel-toggle" title="Toggle Computations Layout" aria-label="Toggle History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Cycle Spectrum Theme" aria-label="Toggle Theme">
            <span class="theme-icon">🌌</span>
          </button>
        </div>
      </header>

      <!-- Multi-tier Execution Mode Selector -->
      <nav class="calc-modes-bar" aria-label="Computational Engine Configurations">
        <button class="mode-tab active" data-engine="standard">Float</button>
        <button class="mode-tab" data-engine="scientific">Sci-Ops</button>
        <button class="mode-tab" data-engine="calculus">Calculus</button>
        <button class="mode-tab" data-engine="programmer">Hex/Bin</button>
      </nav>

      <!-- Advanced Screen Readout Sandbox -->
      <section class="display-section structural-readout" aria-live="polite">
        <div class="display-line-secondary" id="pre-expr" aria-label="Previous context"></div>
        <div class="display-expr" id="expr" contenteditable="false" aria-label="Formula Entry Stack">0</div>
        <div class="display-result-row">
          <span class="eval-arrow">⇒</span>
          <div class="display-result" id="result" aria-label="Evaluated Output Data"></div>
        </div>
      </section>

      <!-- Comprehensive Integrated Layout Matrix -->
      <div class="keypad-matrix">
        
        <!-- Contextual High-Level Functions (Row A) -->
        <div class="matrix-row context-row">
          <button class="btn btn-sci" data-val="sin">sin</button>
          <button class="btn btn-sci" data-val="cos">cos</button>
          <button class="btn btn-sci" data-val="tan">tan</button>
          <button class="btn btn-sci" data-val="log">log</button>
          <button class="btn btn-sci" data-val="ln">ln</button>
        </div>

        <!-- Secondary Advanced Key Stack (Row B) -->
        <div class="matrix-row context-row">
          <button class="btn btn-sci" data-val="pi">π</button>
          <button class="btn btn-sci" data-val="e">e</button>
          <button class="btn btn-sci" data-val="^">xʸ</button>
          <button class="btn btn-sci" data-val="sto">STO →</button>
          <button class="btn btn-sci" data-val="parentheses">( )</button>
        </div>

        <!-- Master Core Grid Map -->
        <div class="main-num-grid">
          <button class="btn btn-clear btn-danger" data-val="AC">AC</button>
          <button class="btn btn-util" data-val="DEL">⌫</button>
          <button class="btn btn-util" data-val="mod">mod</button>
          <button class="btn btn-operator" data-val="÷">÷</button>

          <button class="btn btn-digit" data-val="7">7</button>
          <button class="btn btn-digit" data-val="8">8</button>
          <button class="btn btn-digit" data-val="9">9</button>
          <button class="btn btn-operator" data-val="×">×</button>

          <button class="btn btn-digit" data-val="4">4</button>
          <button class="btn btn-digit" data-val="5">5</button>
          <button class="btn btn-digit" data-val="6">6</button>
          <button class="btn btn-operator" data-val="−">−</button>

          <button class="btn btn-digit" data-val="1">1</button>
          <button class="btn btn-digit" data-val="2">2</button>
          <button class="btn btn-digit" data-val="3">3</button>
          <button class="btn btn-operator" data-val="+">+</button>

          <button class="btn btn-util" data-val="+/-">±</button>
          <button class="btn btn-digit" data-val="0">0</button>
          <button class="btn btn-digit" data-val=".">.</button>
          <button class="btn btn-execution" data-val="=">=</button>
        </div>
      </div>

      <!-- Live Shell Command Footer Hint -->
      <footer class="calc-footer-status">
        <span class="shell-indicator">SYS_READY //</span>
        <span><kbd>⌥ + G</kbd> Plot Canvas &bull; <kbd>Shift + Enter</kbd> Continuous Solve</span>
      </footer>

    </main>
  </div>
  <script src="calculator-engine.js"></script>
</body>
</html>
