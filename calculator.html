<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CALCULATOR 14 — REFINED</title>
  <link rel="stylesheet" href="calculator.css" />
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="theme-premium-dark">

  <!-- Main Calculator Card Element -->
  <main class="calc-card-container">
    
    <!-- Top Meta Context Bar -->
    <div class="calc-context-row">
      <span class="context-badge active">FLOAT64</span>
      <span class="context-history-preview" id="history-preview">ans = 0</span>
    </div>

    <!-- Main Output Screen Readout -->
    <header class="display-screen" aria-live="polite">
      <div class="display-expr" id="expr" aria-label="Input formula">0</div>
      <div class="display-result-wrapper">
        <span class="result-marker">→</span>
        <div class="display-result" id="result" aria-label="Evaluated answer"></div>
      </div>
    </header>

    <!-- Refined Keypad Layout Blocks -->
    <div class="keypad-matrix">
      
      <!-- Utility Row Group -->
      <div class="keypad-row-group utility-group">
        <button class="btn btn-utility btn-clear" data-val="AC">AC</button>
        <button class="btn btn-utility" data-val="DEL" title="Backspace">⌫</button>
        <button class="btn btn-utility" data-val="%">%</button>
        <button class="btn btn-operator" data-val="÷">÷</button>
      </div>

      <!-- Core Alphanumeric Grid Mapping -->
      <div class="keypad-main-grid">
        <button class="btn btn-digit" data-val="7">7</button>
        <button class="btn btn-digit" data-val="8">8</button>
        <button class="btn btn-digit" data-val="9">9</button>
        <button class="btn btn-operator" data-val="×">×</button>

        <button class="btn btn-digit" data-val="4">4</button>
        <button class="btn btn-digit" data-val="5">5</button>
        <button class="btn btn-digit" data-val="6">6</button>
        <button class="btn btn-operator" data-val="−">−</button>

        <button class="btn btn-digit" data-val="1">1</button>
        <button class="btn btn-digit" data-val="2">2</button>
        <button class="btn btn-digit" data-val="3">3</button>
        <button class="btn btn-operator" data-val="+">+</button>

        <button class="btn btn-utility" data-val="+/-">±</button>
        <button class="btn btn-digit" data-val="0">0</button>
        <button class="btn btn-digit" data-val=".">.</button>
        <button class="btn btn-execution" data-val="=">=</button>
      </div>
    </div>

  </main>

  <script src="calculator.js"></script>
</body>
</html>
