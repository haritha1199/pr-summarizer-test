<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CALCULATOR 14 — ESSENTIAL</title>
  <link rel="stylesheet" href="calculator.css" />
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="theme-minimal">

  <!-- Main Calculator Card -->
  <main class="calc-card">
    
    <!-- Top Display Readout -->
    <header class="display-group" aria-live="polite">
      <div class="display-expr" id="expr" aria-label="Expression">0</div>
      <div class="display-result" id="result" aria-label="Result"></div>
    </header>

    <!-- Keypad Layout Matrix -->
    <div class="keypad-grid">
      <!-- Row 1: Clear and Operators -->
      <button class="btn btn-func btn-clear" data-val="AC">AC</button>
      <button class="btn btn-func" data-val="DEL" title="Backspace">⌫</button>
      <button class="btn btn-func" data-val="%">%</button>
      <button class="btn btn-op" data-val="÷">÷</button>

      <!-- Row 2 -->
      <button class="btn btn-num" data-val="7">7</button>
      <button class="btn btn-num" data-val="8">8</button>
      <button class="btn btn-num" data-val="9">9</button>
      <button class="btn btn-op" data-val="×">×</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-val="4">4</button>
      <button class="btn btn-num" data-val="5">5</button>
      <button class="btn btn-num" data-val="6">6</button>
      <button class="btn btn-op" data-val="−">−</button>

      <!-- Row 4 -->
      <button class="btn btn-num" data-val="1">1</button>
      <button class="btn btn-num" data-val="2">2</button>
      <button class="btn btn-num" data-val="3">3</button>
      <button class="btn btn-op" data-val="+">+</button>

      <!-- Row 5 -->
      <button class="btn btn-func" data-val="+/-">±</button>
      <button class="btn btn-num" data-val="0">0</button>
      <button class="btn btn-num" data-val=".">.</button>
      <button class="btn btn-eq" data-val="=">=</button>
    </div>

  </main>

  <script src="calculator.js"></script>
</body>
</html>
