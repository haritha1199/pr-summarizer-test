<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CALCULATOR 14 — ADVANCED WORKSTATION</title>
  <link rel="stylesheet" href="calculator.css" />
  <link href="https://googleapis.com" rel="stylesheet"/>
</head>
<body class="theme-terminal-pro">
  <div class="calc-ide-wrapper">
    
    <!-- Panel 1: Variable Storage & Matrix Workspace Sidecar -->
    <aside class="ide-sidebar left-panel" aria-label="Registers and Linear Algebra Workspace">
      <div class="panel-section">
        <div class="section-title-bar">
          <span class="tech-label">MATRIX MAPPING // 2x2 & 3x3</span>
        </div>
        <!-- Matrix Parameter Scaffold Input Boxes -->
        <div class="matrix-scaffold-grid">
          <div class="matrix-row-inputs">
            <input type="number" class="matrix-cell" value="1" aria-label="Matrix cell A11"/>
            <input type="number" class="matrix-cell" value="0" aria-label="Matrix cell A12"/>
          </div>
          <div class="matrix-row-inputs">
            <input type="number" class="matrix-cell" value="0" aria-label="Matrix cell A21"/>
            <input type="number" class="matrix-cell" value="1" aria-label="Matrix cell A22"/>
          </div>
        </div>
        <div class="matrix-actions-row">
          <button class="btn-micro" id="det-calc">DET</button>
          <button class="btn-micro" id="inv-calc">INV</button>
          <button class="btn-micro" id="trans-calc">TRANS</button>
        </div>
      </div>

      <!-- Variable Register Arrays -->
      <div class="panel-section operational-registers">
        <div class="section-title-bar"><span class="tech-label">MEMORY BANK REGISTERS</span></div>
        <ul class="register-list-stack">
          <li><span class="reg-key">REG_A</span> <span class="reg-val" id="reg-a">0x00000000</span></li>
          <li><span class="reg-key">REG_B</span> <span class="reg-val" id="reg-b">0x00000000</span></li>
          <li><span class="reg-key">REG_C</span> <span class="reg-val" id="reg-c">0x00000000</span></li>
        </ul>
      </div>
    </aside>

    <!-- Panel 2: Computational core & display terminal -->
    <main class="calc-card central-engine">
      
      
      <header class="calc-header">
        <div class="header-left">
          <span class="brand-badge text-glow">CORE ENGINE // V14-PRO</span>
        </div>
        <div class="system-diagnostics">
          <span class="diag-item">MEM_OK</span>
          <span class="diag-item mode-active" id="active-base-label">DEC</span>
        </div>
      </header>

      <!-- Advanced Multiline Display Monitor -->
      <section class="display-section terminal-readout" aria-live="polite">
        <div class="display-expr-stack" id="expr-stack">
          <div class="stack-line historical-line">f(x) = ax² + bx + c</div>
        </div>
        <div class="live-input-row">
          <span class="terminal-prompt">&gt;</span>
          <div class="display-expr" id="expr" contenteditable="true" spellcheck="false">0</div>
        </div>
        <div class="live-output-row">
          <span class="terminal-return">&lt;</span>
          <div class="display-result" id="result">0</div>
        </div>
      </section>

      <!-- Programmer Mode Bitwise Base Registers -->
      <section class="programmer-base-bar" aria-label="Bitwise Bit-Bashing Base Registers">
        <div class="base-row" id="base-hex"><span class="base-tag">HEX</span><span class="base-val">0x0</span></div>
        <div class="base-row active-base" id="base-dec"><span class="base-tag">DEC</span><span class="base-val">0</span></div>
        <div class="base-row" id="base-oct"><span class="base-tag">OCT</span><span class="base-val">0</span></div>
        <div class="base-row" id="base-bin"><span class="base-tag">BIN</span><span class="base-val">0b0</span></div>
      </section>

      <!-- Ergonomic Complete Key Grid Matrix Layout -->
      <div class="keypad-matrix-grid">
        <!-- Advanced operational macros row -->
        <button class="btn btn-macro" data-val="AND">AND</button>
        <button class="btn btn-macro" data-val="OR">OR</button>
        <button class="btn btn-macro" data-val="XOR">XOR</button>
        <button class="btn btn-macro" data-val="NOT">NOT</button>

        <!-- Base alphanumeric numbers and controls mixed grid layout -->
        <button class="btn btn-danger-action" data-val="AC">AC</button>
        <button class="btn btn-util-action" data-val="DEL">⌫</button>
        <button class="btn btn-util-action" data-val="(">(</button>
        <button class="btn btn-util-action" data-val=")">)</button>

        <button class="btn btn-num-cell" data-val="7">7</button>
        <button class="btn btn-num-cell" data-val="8">8</button>
        <button class="btn btn-num-cell" data-val="9">9</button>
        <button class="btn btn-op-cell" data-val="÷">÷</button>

        <button class="btn btn-num-cell" data-val="4">4</button>
        <button class="btn btn-num-cell" data-val="5">5</button>
        <button class="btn btn-num-cell" data-val="6">6</button>
        <button class="btn btn-op-cell" data-val="×">×</button>

        <button class="btn btn-num-cell" data-val="1">1</button>
        <button class="btn btn-num-cell" data-val="2">2</button>
        <button class="btn btn-num-cell" data-val="3">3</button>
        <button class="btn btn-op-cell" data-val="−">−</button>

        <button class="btn btn-num-cell" data-val="0">0</button>
        <button class="btn btn-num-cell" data-val=".">.</button>
        <button class="btn btn-num-cell" data-val="00">00</button>
        <button class="btn btn-op-cell" data-val="+">+</button>

        <!-- Large execution baseline block across row -->
        <button class="btn btn-execute-action" data-val="=">=</button>
      </div>

    </main>

    <!-- Panel 3: Continuous Log Execution Audit Trail -->
    <aside class="ide-sidebar right-panel" aria-label="Persistent Audit Trail Stack">
      <div class="panel-section full-height-section">
        <div class="section-title-bar">
          <span class="tech-label">LOG AUDIT TRAIL</span>
          <button class="clear-log-btn" id="flush-log">FLUSH</button>
        </div>
        <ol class="audit-log-list" id="audit-log-list">
          <li class="log-item-entry">
            <span class="log-timestamp">[01:58:27]</span>
            <p class="log-msg">SYS_INIT :: Core components initialized.</p>
          </li>
        </ol>
      </div>
    </aside>

  </div>
  <script src="calculator-core.js"></script>
</body>
</html>
