<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CALCULATOR 14 — PRO</title>
  <link rel="stylesheet" href="calculator.css" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet"/>
</head>
<body class="theme-dark">
  <div class="calc-container">
    <main class="calc-card">
      
      <!-- Top Control Bar -->
      <header class="calc-header">
        <div class="header-left">
          <span class="brand-badge">CALC // 14</span>
          <span class="memory-badge" id="memory-indicator" aria-label="Memory stored">M</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="history-toggle" title="Toggle History" aria-label="Toggle History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </button>
          <button class="icon-btn" id="theme-toggle" title="Toggle Theme" aria-label="Toggle Theme">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
      </header>

      <!-- Submenu / Mode Row Selector -->
      <nav class="calc-modes" aria-label="Calculator Modes">
        <button class="mode-btn active" data-mode="std">Standard</button>
        <button class="mode-btn" data-mode="sci">Scientific</button>
        <button class="mode-btn" data-mode="matrix">Matrix</button>
      </nav>

      <!-- Main Screen Readout -->
      <section class="display-section" aria-live="polite">
        <div class="display-expr" id="expr" aria-label="Expression">0</div>
        <div class="display-result" id="result" aria-label="Result"></div>
      </section>

      <!-- Slide-Out / Collapsible History Drawer -->
      <aside class="history-drawer" id="history" aria-hidden="true">
        <div class="history-header">
          <span>Calculation History</span>
          <button class="btn-text" id="clear-history">Clear</button>
        </div>
        <ul class="history-list" id="history-list">
          <li class="history-empty">No history yet</li>
        </ul>
      </aside>

      <!-- Keypad Grid -->
      <div class="keypad">
        <!-- Memory Row -->
        <div class="keypad-row memory-row">
          <button class="btn btn-mem" data-val="MC">MC</button>
          <button class="btn btn-mem" data-val="MR">MR</button>
          <button class="btn btn-mem" data-val="M+">M+</button>
          <button class="btn btn-mem" data-val="M-">M−</button>
        </div>

        <!-- Main Input Grid -->
        <div class="keypad-grid">
          <!-- Row 1: High level utilities -->
          <button class="btn btn-func btn-accent-danger" data-val="AC">AC</button>
          <button class="btn btn-func" data-val="DEL" title="Backspace">⌫</button>
          <button class="btn btn-func" data-val="%">%</button>
          <button class="btn btn-op" data-val="÷">÷</button>

          <!-- Row 2 -->
          <button class="btn btn-num" data-val="7">7</button>
          <button class="btn btn-num" data-val="8">8</button>
          <button class="btn btn-num" data-val="9">9</button>
          <button class="btn btn-op" data-val="×">×</button>

          <!-- Row 3 -->
          <button class="btn btn-num" data-val="4">4</button>
          <button class="btn btn-num" data-val="5">5</button>
          <button class="btn btn-num" data-val="6">6</button>
          <button class="btn btn-op" data-val="−">−</button>

          <!-- Row 4 -->
          <button class="btn btn-num" data-val="1">1</button>
          <button class="btn btn-num" data-val="2">2</button>
          <button class="btn btn-num" data-val="3">3</button>
          <button class="btn btn-op" data-val="+">+</button>

          <!-- Row 5 -->
          <button class="btn btn-func" data-val="+/-">+/−</button>
          <button class="btn btn-num" data-val="0">0</button>
          <button class="btn btn-num" data-val=".">.</button>
          <button class="btn btn-func" data-val="√">√</button>

          <!-- Equals (Spans full width at bottom for ergonomics) -->
          <button class="btn btn-eq" data-val="=">=</button>
        </div>
      </div>

      <!-- Footer / Keyboard Shortcut Hint -->
      <footer class="calc-footer">
        <span>Press <kbd>Esc</kbd> Clear &bull; <kbd>Backspace</kbd> Del &bull; <kbd>Enter</kbd> =</span>
      </footer>

    </main>
  </div>
  <script src="calculator.js"></script>
</body>
</html>
